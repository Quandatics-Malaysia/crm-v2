# Deploy the STAGING stack after the `quality` workflow succeeds on `main`.
# Mirrors deploy.yml
# but targets a separate server checkout (~/crm-v2-staging) and Compose project
# (crm-staging), in its own concurrency group so it never fights the prod deploy.
#
# One-time server setup (see the "Staging environment" runbook in
# https://github.com/Super-ERP/docs/blob/main/archive/operations/OPERATIONS.md):
#   git clone <repo> ~/crm-v2-staging && cd ~/crm-v2-staging && git checkout <sha>
#   cp .env.staging.example .env.staging   # then fill in fresh secrets
name: deploy-staging

on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Skip documentation-only changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}" \
            --jq '.files[].filename')"
          if printf '%s\n' "$changed_files" | grep -qvE '^(docs/|README\.md$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build-images:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            repository: crm-web
            target: runner
          - name: migrator
            repository: crm-migrator
            target: migrator
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_NAMESPACE: ghcr.io/super-erp
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push staging image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.repository }}:sha-${{ env.DEPLOY_SHA }}
          provenance: false
          cache-from: type=gha,scope=staging-${{ matrix.name }},ghtoken=${{ secrets.GITHUB_TOKEN }},repository=${{ github.repository }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.name }},timeout=20m,ignore-error=true

  deploy-staging:
    needs: [changes, build-images]
    if: needs.changes.outputs.deploy == 'true' && needs.build-images.result == 'success'
    runs-on: self-hosted
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      WEB_IMAGE: ghcr.io/super-erp/crm-web:sha-${{ github.event.workflow_run.head_sha }}
      MIGRATOR_IMAGE: ghcr.io/super-erp/crm-migrator:sha-${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      # Self-bootstrapping: creates the staging checkout + base env on first run,
      # then upgrades retained deployment-control values on every release.
      # Staging is reachable at 127.0.0.1:8092 through its quick tunnel.
      - name: Bootstrap or upgrade staging checkout + env
        env:
          VENDOR_ENTITLEMENT_TRUST_SET: ${{ secrets.STAGING_VENDOR_ENTITLEMENT_TRUST_SET }}
        run: |
          set -euo pipefail
          DIR="${STAGING_DIR:-$HOME/crm-v2-staging}"
          REPOSITORY_URL="https://github.com/Super-ERP/crm-v2.git"
          if [ ! -d "$DIR/.git" ]; then
            git clone "$REPOSITORY_URL" "$DIR"
          fi
          git -C "$DIR" fetch origin main "${DEPLOY_SHA}"
          git -C "$DIR" checkout -f "${DEPLOY_SHA}"
          if [ ! -f "$DIR/.env.staging" ]; then
            cd "$DIR"
            cp .env.staging.example .env.staging
            gen() { openssl rand -hex 24; }
            sed -i "s|change_me_staging_postgres|$(gen)|" .env.staging
            sed -i "s|change_me_staging_crm_app|$(gen)|" .env.staging
            sed -i "s|change_me_run_openssl_rand_base64_32|$(openssl rand -base64 32)|" .env.staging
            ADMIN_PW="$(openssl rand -hex 16)"
            SAMPLE_PW="$(openssl rand -hex 16)"
            sed -i "s|change_me_strong_staging_master|${ADMIN_PW}|" .env.staging
            sed -i "s|change_me_strong_staging_sample|${SAMPLE_PW}|" .env.staging
            # No public domain: reach staging via SSH tunnel to 127.0.0.1:8092.
            sed -i "s|staging.quandatics.com|localhost:8092|g" .env.staging
            sed -i "s|https://localhost:8092|http://localhost:8092|g" .env.staging
          fi
          sed -i "s|^CADDY_HOST_PORT=.*|CADDY_HOST_PORT=8092|" "$DIR/.env.staging"
          node "$DIR/.github/workflows/scripts/provision-deployment-runtime.mjs" --mode staging --env-file "$DIR/.env.staging" --repo-root "$DIR"
      - name: Reconcile retained staging database password
        run: |
          set -euo pipefail
          DIR="${STAGING_DIR:-$HOME/crm-v2-staging}"
          POSTGRES_PASSWORD="$(sed -n 's/^POSTGRES_PASSWORD=//p' "$DIR/.env.staging" | tail -1)"
          if [[ ! "$POSTGRES_PASSWORD" =~ ^[0-9a-f]{48}$ ]]; then
            echo "Invalid staging PostgreSQL password format" >&2
            exit 1
          fi
          if docker ps --format '{{.Names}}' | grep -qx crm-staging-db-1; then
            docker exec \
              -u postgres \
              -e TARGET_PASSWORD="$POSTGRES_PASSWORD" \
              crm-staging-db-1 \
              sh -ceu 'psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres PASSWORD '\''$TARGET_PASSWORD'\'';" >/dev/null'
          fi
      # Phase 1: pull the GitHub-built images and bring the whole stack + tunnel
      # up. web boots with the current
      # (possibly stale) BETTER_AUTH_URL; phase 2 repoints it to the live tunnel
      # URL so Better Auth trusts the public origin (else login -> INVALID_ORIGIN).
      - name: Pull and start the staging stack (+ public tunnel)
        run: |
          set -euo pipefail
          DIR="${STAGING_DIR:-$HOME/crm-v2-staging}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          compose=(docker compose \
            -p crm-staging \
            -f "$DIR/docker-compose.yaml" \
            -f "$DIR/docker-compose.staging-images.yaml" \
            -f "$DIR/docker-compose.staging-tunnel.yaml" \
            --env-file "$DIR/.env.staging")
          if ! "${compose[@]}" up -d --pull always --no-build migrate web caddy tunnel; then
            echo "Migration/startup failed. Container status:"
            "${compose[@]}" ps -a
            echo "Migration logs:"
            "${compose[@]}" logs --no-color --tail=200 migrate
            exit 1
          fi
      # Phase 2: capture the random tunnel URL, point BETTER_AUTH_URL/APP_URL at
      # it, and recreate ONLY web so auth accepts requests through the tunnel.
      - name: Point auth at the tunnel URL and recreate web
        id: url
        run: |
          DIR="${STAGING_DIR:-$HOME/crm-v2-staging}"
          URL=""
          for i in $(seq 1 45); do
            URL=$(docker logs crm-staging-tunnel-1 2>&1 | grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" | tail -1)
            [ -n "$URL" ] && break
            sleep 4
          done
          if [ -z "$URL" ]; then
            echo "Tunnel URL not captured. cloudflared logs:"; docker logs crm-staging-tunnel-1 2>&1 | tail -30 || true
            exit 1
          fi
          echo "STAGING_URL=$URL" >> "$GITHUB_OUTPUT"
          sed -i "s|^BETTER_AUTH_URL=.*|BETTER_AUTH_URL=${URL}|" "$DIR/.env.staging"
          sed -i "s|^APP_URL=.*|APP_URL=${URL}|" "$DIR/.env.staging"
          docker compose \
            -p crm-staging \
            -f "$DIR/docker-compose.yaml" \
            -f "$DIR/docker-compose.staging-images.yaml" \
            -f "$DIR/docker-compose.staging-tunnel.yaml" \
            --env-file "$DIR/.env.staging" \
            up -d --pull always --force-recreate --no-deps web
      - name: Health check (via the public tunnel URL)
        run: |
          URL="${{ steps.url.outputs.STAGING_URL }}"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 6 "$URL/api/health" >/dev/null 2>&1; then
              echo "staging $URL/api/health OK"; break
            fi
            echo "waiting for staging web through the tunnel... ($i)"; sleep 5
          done
          curl -fsS --max-time 6 "$URL/api/health" >/dev/null || { echo "health FAILED"; docker compose -p crm-staging logs --tail=50 web migrate || true; exit 1; }
      - name: Verify email/password login
        run: |
          set -euo pipefail
          DIR="${STAGING_DIR:-$HOME/crm-v2-staging}"
          URL="${{ steps.url.outputs.STAGING_URL }}"
          get_env() {
            sed -n "s/^$1=//p" "$DIR/.env.staging" | tail -1
          }
          ADMIN_EMAIL="$(get_env PLATFORM_MASTER_EMAIL)"
          ADMIN_PW="$(get_env PLATFORM_MASTER_PASSWORD)"
          HTTP_CODE=$(curl -sS --max-time 12 \
            -o /tmp/crm-staging-auth-response.json \
            -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "Origin: ${URL}" \
            --data "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PW}\"}" \
            "$URL/api/auth/sign-in/email")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "staging email/password login FAILED with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "staging email/password login OK"
      - name: Publish staging access
        if: always()
        run: |
          set -euo pipefail
          DIR="${STAGING_DIR:-$HOME/crm-v2-staging}"
          URL="${{ steps.url.outputs.STAGING_URL }}"
          get_env() {
            sed -n "s/^$1=//p" "$DIR/.env.staging" | tail -1
          }
          if [ -n "$URL" ]; then
            {
              echo "## Staging"
              echo ""
              echo "**Open:** $URL"
              echo ""
              echo "Use **email and password**. Microsoft SSO is intentionally unavailable because the quick-tunnel hostname changes on each redeploy and cannot be pre-registered as an Entra callback URL."
              echo ""
              echo "Credentials are stored in the protected staging environment; they are never printed in workflow logs or summaries."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "STAGING_PUBLIC_URL=$URL"
          fi
