name: deploy-production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a signed release or inspect protected release state
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - inspect
          - prepare-backup
      release_tag:
        description: Signed strict SemVer release, for example v1.2.20
        required: true
        type: string
  workflow_run:
    workflows: [release-images]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLIENT_DIR: /home/internalops/quandatics-client
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Inspect protected release state
        if: inputs.operation == 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$CLIENT_DIR/.env" ] || { echo "protected production env is missing" >&2; exit 1; }

          read_env_path() {
            local key=$1 value
            value="$(awk -F= -v key="$key" '$1 == key { sub(/^[^=]*=/, ""); print; found=1 } END { if (!found) exit 1 }' "$CLIENT_DIR/.env")"
            case "$value" in /*) ;; *) echo "$key is not an absolute path" >&2; exit 1 ;; esac
            printf '%s\n' "$value"
          }
          read_release_tag() {
            local label=$1 file=$2 value
            [ -f "$file" ] || { printf '%s=missing\n' "$label"; return; }
            value="$(awk -F= '$1 == "RELEASE_TAG" { print $2; found=1 } END { if (!found) exit 1 }' "$file")"
            [[ "$value" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$label has an invalid release tag" >&2; exit 1; }
            printf '%s=%s\n' "$label" "$value"
          }

          evidence_file="$(read_env_path BACKUP_EVIDENCE_FILE)"
          record_file="$(read_env_path DEPLOYMENT_RECORD_FILE)"
          printf 'TARGET_RELEASE_TAG=%s\n' "$RELEASE_TAG"
          read_release_tag BACKUP_EVIDENCE_RELEASE_TAG "$evidence_file"
          read_release_tag DEPLOYED_RELEASE_TAG "$record_file"
          printf '%s\n' 'BACKUP_PRODUCER_CANDIDATES_BEGIN'
          find "$CLIENT_DIR" /usr/local/bin /usr/local/sbin -maxdepth 3 -type f \
            \( -iname '*backup*' -o -iname '*evidence*' \) -print 2>/dev/null | sort || true
          systemctl list-unit-files --no-legend 2>/dev/null \
            | awk 'tolower($1) ~ /(backup|evidence)/ { print $1 }' \
            | sort -u || true
          printf '%s\n' 'BACKUP_PRODUCER_CANDIDATES_END'

      - name: Download verified source-free release bundle
        if: github.event_name == 'workflow_run' || inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            ARTIFACT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/artifacts?per_page=100")"
            RELEASE_TAG="$(printf '%s' "$ARTIFACT_JSON" | jq -er '
              [.artifacts[] | select(.expired == false and (.name | startswith("client-deployment-bundle-v"))) | .name]
              | if length == 1 then .[0] else error("expected exactly one signed release bundle") end
              | sub("^client-deployment-bundle-"; "")
            ')"
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag" >&2; exit 1; }
          [ -f "$CLIENT_DIR/.env" ] || { echo "protected production env is missing" >&2; exit 1; }

          ARTIFACT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=client-deployment-bundle-${RELEASE_TAG}&per_page=100" \
            | jq -c '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last')"
          [ "$ARTIFACT_JSON" != "null" ] || { echo "signed release bundle not found" >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != workflow_run ]; then
            RELEASE_RUN_ID="$(printf '%s' "$ARTIFACT_JSON" | jq -er '.workflow_run.id')"
            echo "RELEASE_RUN_ID=$RELEASE_RUN_ID" >> "$GITHUB_ENV"
          fi
          RELEASE_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          printf '%s' "$RELEASE_RUN" | jq -e --arg tag "$RELEASE_TAG" '
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .path == ".github/workflows/release-images.yml" and
            (.head_branch == "main" or .head_branch == $tag)
          ' >/dev/null || { echo "release bundle did not come from a successful vendor tag workflow" >&2; exit 1; }

          TEMP_DIR="$(mktemp -d)"
          echo "TEMP_DIR=$TEMP_DIR" >> "$GITHUB_ENV"
          gh run download "$RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "client-deployment-bundle-${RELEASE_TAG}" \
            --dir "$TEMP_DIR/bundle"

          command -v cosign >/dev/null 2>&1 || { echo "cosign is required" >&2; exit 1; }
          cosign verify-blob \
            --bundle "$TEMP_DIR/bundle/client-deployment-bundle.sigstore.json" \
            --certificate-identity "https://github.com/Super-ERP/crm-v2/.github/workflows/release-images.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$TEMP_DIR/bundle/client-deployment-bundle.tar.gz"
          mkdir "$TEMP_DIR/verified"
          tar -xzf "$TEMP_DIR/bundle/client-deployment-bundle.tar.gz" -C "$TEMP_DIR/verified"

          BUNDLE_DIR="$TEMP_DIR/verified/client"
          [ -n "$BUNDLE_DIR" ] && [ -f "$BUNDLE_DIR/deploy.sh" ] || { echo "invalid release bundle" >&2; exit 1; }

          install -d -m 0700 "$CLIENT_DIR" "$CLIENT_DIR/ops"
          install -m 0700 "$BUNDLE_DIR"/*.sh "$CLIENT_DIR/"
          install -m 0700 "$BUNDLE_DIR"/ops/*.sh "$CLIENT_DIR/ops/"
          install -m 0644 "$BUNDLE_DIR/compose.yaml" "$BUNDLE_DIR/Caddyfile" "$CLIENT_DIR/"
          install -m 0600 "$BUNDLE_DIR/release-manifest.json" "$CLIENT_DIR/release-manifest.json"

      - name: Prepare signed backup evidence for deployed release
        if: inputs.operation == 'prepare-backup'
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$CLIENT_DIR/backup"
          legacy_evidence_file=/var/lib/quandatics-client/backup/verified-release.env
          legacy_signature_file=/var/lib/quandatics-client/backup/verified-release.env.sig
          evidence_file="$backup_dir/verified-release.env"
          signature_file="$backup_dir/verified-release.env.sig"
          install -d -m 0700 "$backup_dir"
          configured_evidence_file="$(awk -F= '$1 == "BACKUP_EVIDENCE_FILE" { sub(/^[^=]*=/, ""); print; found++ } END { if (found != 1) exit 1 }' "$CLIENT_DIR/.env")"
          configured_signature_file="$(awk -F= '$1 == "BACKUP_EVIDENCE_SIGNATURE_FILE" { sub(/^[^=]*=/, ""); print; found++ } END { if (found != 1) exit 1 }' "$CLIENT_DIR/.env")"
          if [ "$configured_evidence_file" = "$legacy_evidence_file" ] && [ "$configured_signature_file" = "$legacy_signature_file" ]; then
            cp "$legacy_evidence_file" "$evidence_file"
            cp "$legacy_signature_file" "$signature_file"
            chmod 0600 "$evidence_file" "$signature_file"
            env_tmp="$(mktemp "$CLIENT_DIR/.env.backup-path.XXXXXX")"
            awk -F= -v evidence="$evidence_file" -v signature="$signature_file" '
              $1 == "BACKUP_EVIDENCE_FILE" { print "BACKUP_EVIDENCE_FILE=" evidence; next }
              $1 == "BACKUP_EVIDENCE_SIGNATURE_FILE" { print "BACKUP_EVIDENCE_SIGNATURE_FILE=" signature; next }
              { print }
            ' "$CLIENT_DIR/.env" >"$env_tmp"
            chmod 0600 "$env_tmp"
            mv "$env_tmp" "$CLIENT_DIR/.env"
          elif [ "$configured_evidence_file" != "$evidence_file" ] || [ "$configured_signature_file" != "$signature_file" ]; then
            echo "backup evidence paths are outside the protected deployment directory" >&2
            exit 1
          fi
          [ -d "$backup_dir" ] && [ ! -L "$backup_dir" ] && [ -w "$backup_dir" ] || {
            echo "protected backup directory is not writable by the deployment user" >&2
            exit 1
          }
          "$CLIENT_DIR/ops/prepare-backup-evidence.sh" \
            "$CLIENT_DIR/.env" \
            "$CLIENT_DIR/backup/.backup-evidence.key"

      - name: Apply manifest and deploy signed digests
        if: github.event_name == 'workflow_run' || inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY_AUTH_DIR="$(mktemp -d)"
          export DOCKER_CONFIG="$REGISTRY_AUTH_DIR"
          trap 'rm -rf -- "$REGISTRY_AUTH_DIR"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          "$CLIENT_DIR/apply-release-manifest.sh" "$CLIENT_DIR/.env" "$CLIENT_DIR/release-manifest.json" "$RELEASE_TAG"
          "$CLIENT_DIR/deploy.sh" "$CLIENT_DIR/.env"

      - name: Clean temporary bundle
        if: always()
        shell: bash
        run: |
          if [ -n "${TEMP_DIR:-}" ] && [ -d "$TEMP_DIR" ]; then
            find "$TEMP_DIR" -type f -exec chmod u+w {} + 2>/dev/null || true
            rm -rf -- "$TEMP_DIR"
          fi
