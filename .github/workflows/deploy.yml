# CI + deploy.
#   - On every PR into main: the `quality` gate runs (lint/typecheck/test/build)
#     on a GitHub-hosted runner. The `deploy` job is skipped.
#   - On push to main (i.e. a merge): `quality` runs, then `deploy` rebuilds on
#     the server via a SELF-HOSTED runner (build happens on the box — no
#     registries, no cloud).
#
# One-time setup on the server:
#   1. Clone the repo somewhere persistent (e.g. /opt/crm-v2) with a .env.
#   2. Install a self-hosted runner for this repo (Settings → Actions →
#      Runners → New self-hosted runner) and run it as a service:
#      https://docs.github.com/en/actions/hosting-your-own-runners
#   3. Give the runner user access to docker (usermod -aG docker <user>).
name: deploy

on:
  push:
    branches: [main]
    # Docs-only merges don't change the running app — skip the whole workflow
    # (and the production rebuild) when nothing outside these paths changed.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs-quality.yml"
      - "LICENSE"
  pull_request:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared control protocol
        run: pnpm --filter @crm/control-protocol run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Migrate PostgreSQL enforcement test database
        run: pnpm --filter web run db:migrate
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/crm
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm
          CRM_APP_PASSWORD: crm_app_test
          BETTER_AUTH_SECRET: ci-test-secret-32-bytes-minimum-value
      - name: Test, requiring PostgreSQL enforcement coverage
        run: pnpm test -- --maxWorkers=1
        env:
          REQUIRE_DEPLOYMENT_CONTROL_DB_TESTS: "1"
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/crm
          TEST_DATABASE_URL: postgres://crm_app:crm_app_test@localhost:5432/crm
      - name: Verify deployment entitlement CI contract
        run: node --test .github/workflows/tests/deploy-entitlement-db.test.mjs
      - run: pnpm run build

  deploy:
    needs: quality
    # Only on a real merge to main — never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      # Update the server's persistent checkout, not the runner workdir.
      - name: Pull latest main
        run: |
          set -euo pipefail
          CRM_DIR="${CRM_DIR:-$HOME/crm-v2}"
          if [ ! -d "$CRM_DIR" ]; then
            if [ -d "$HOME/actions-runner/_work/crm-v2/crm-v2" ]; then
              CRM_DIR="$HOME/actions-runner/_work/crm-v2/crm-v2"
            elif [ -d "$HOME/crm-v2-staging" ]; then
              CRM_DIR="$HOME/crm-v2-staging"
            elif [ -d "$HOME/crm-v2" ]; then
              CRM_DIR="$HOME/crm-v2"
            fi
          fi

          if [ ! -d "$CRM_DIR/.git" ]; then
            echo "deploy checkout not found: ${CRM_DIR}" >&2
            exit 1
          fi

          git -C "$CRM_DIR" fetch origin main
          git -C "$CRM_DIR" checkout -B main origin/main
          git -C "$CRM_DIR" reset --hard origin/main

          ENV_FILE=""
          candidates=(
            "$CRM_DIR/.env"
            "$CRM_DIR/.env.production"
            "$HOME/actions-runner/.env"
            "$HOME/quandatics-client/.env"
          )

          for candidate in "${candidates[@]}"; do
            if [ -f "$candidate" ]; then
              ppw="$(sed -n 's/^POSTGRES_PASSWORD=//p' "$candidate" | tail -1)"
              if [ -n "$ppw" ]; then
                ENV_FILE="$candidate"
                break
              fi
            fi
          done

          if [ -z "$ENV_FILE" ]; then
            echo "deploy env file not found with POSTGRES_PASSWORD set" >&2
            echo "Checked candidates: ${candidates[*]}" >&2
            exit 1
          else
            echo "Using env file: $ENV_FILE"
            echo "Required env keys present:"
            for key in POSTGRES_PASSWORD CRM_APP_PASSWORD BETTER_AUTH_SECRET BETTER_AUTH_URL PLATFORM_MASTER_EMAIL PLATFORM_MASTER_PASSWORD DEPLOYMENT_ID AGENT_WEB_SECRET VENDOR_ENTITLEMENT_TRUST_SET APPLICATION_VERSION MIGRATION_VERSION; do
              value="$(sed -n "s/^${key}=//p" "$ENV_FILE" | tail -1 | tr -d '\r')"
              if [ -z "$value" ]; then
                echo "  - ${key}: missing"
              else
                echo "  - ${key}: ${#value} chars"
              fi
            done
          fi

          echo "CRM_DIR=$CRM_DIR" >> "$GITHUB_ENV"
          echo "DEPLOY_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
      # migrate runs as a one-shot before web starts (web depends_on it).
      - name: Rebuild and restart
        run: |
          set +e
          docker compose --env-file "${DEPLOY_ENV_FILE}" -f "${CRM_DIR:-$HOME/crm-v2}/docker-compose.yaml" up -d --build migrate web
          up_exit=$?
          if [ "$up_exit" -ne 0 ]; then
            docker compose --env-file "${DEPLOY_ENV_FILE}" -f "${CRM_DIR:-$HOME/crm-v2}/docker-compose.yaml" logs --tail=300 migrate || true
            exit "$up_exit"
          fi
          docker compose --env-file "${DEPLOY_ENV_FILE}" -f "${CRM_DIR:-$HOME/crm-v2}/docker-compose.yaml" wait migrate
          migrate_exit=$?
          if [ "$migrate_exit" -ne 0 ]; then
            docker compose --env-file "${DEPLOY_ENV_FILE}" -f "${CRM_DIR:-$HOME/crm-v2}/docker-compose.yaml" logs --tail=300 migrate || true
            exit "$migrate_exit"
          fi
