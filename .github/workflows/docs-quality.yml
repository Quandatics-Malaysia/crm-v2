name: docs-quality

on:
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "MODULES.md"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "MODULES.md"
      - ".github/workflows/docs-quality.yml"

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy verified documentation to Vercel
        run: npx --yes vercel@56.3.1 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Rx6wYiwPothqxgVdI55KUni9
          VERCEL_PROJECT_ID: prj_nmAUm5WgmcLI48qsdwrqrUUP6EjE
