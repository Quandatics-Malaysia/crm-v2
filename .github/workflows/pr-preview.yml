name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-preview-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_number }}
  cancel-in-progress: false

jobs:
  quality:
    # no deployment for PR close; just keep the normal quality signal on active PRs
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run test:workflows
      - run: pnpm run build

  deploy-preview:
    needs: quality
    if: github.event.action != 'closed' && github.repository == github.event.pull_request.head.repo.full_name
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build PR preview stack
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PROJECT="crm-pr-${PR_NUMBER}"
          PREVIEW_ENV="${{ github.workspace }}/.env.pr-preview"
          ADMIN_EMAIL="owner-pr-${PR_NUMBER}@quandatics-preview.local"

          mkdir -p "$(dirname "$PREVIEW_ENV")"
          if [ ! -f "$PREVIEW_ENV" ]; then
            {
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
              echo "CRM_APP_PASSWORD=$(openssl rand -hex 24)"
              echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
              echo "PLATFORM_MASTER_EMAIL=${ADMIN_EMAIL}"
              echo "PLATFORM_MASTER_PASSWORD=$(openssl rand -hex 16)"
              echo "DEMO_ADMIN_EMAIL=${ADMIN_EMAIL}"
              echo "DEMO_ADMIN_PASSWORD=$(openssl rand -hex 16)"
              echo "DEMO_TENANT_ID=demo-pr-${PR_NUMBER}"
              echo "DEMO_TENANT_NAME=PR-${PR_NUMBER} Demo Workspace"
              echo "SEED_SAMPLE_DATA=true"
              echo "SEED_SAMPLE_PASSWORD=$(openssl rand -hex 12)"
              echo "CADDY_BIND_HOST=127.0.0.1"
              echo "DB_HOST_PORT=0"
              echo "CADDY_HOST_PORT=0"
              echo "BETTER_AUTH_URL=http://127.0.0.1"
              echo "APP_URL=http://127.0.0.1"
              echo "DOMAIN=preview.quandatics.local"
            } > "$PREVIEW_ENV"
          fi
          node .github/workflows/scripts/provision-deployment-runtime.mjs --mode preview --env-file "$PREVIEW_ENV"

          docker compose \
            -p "$PROJECT" \
            -f docker-compose.yaml \
            -f docker-compose.pr-preview.yaml \
            -f docker-compose.staging-tunnel.yaml \
            --env-file "$PREVIEW_ENV" \
            up -d --build migrate web caddy tunnel

          for i in $(seq 1 45); do
            PREVIEW_URL=$(docker logs "${PROJECT}-tunnel-1" 2>&1 | grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" | tail -1 || true)
            if [ -n "$PREVIEW_URL" ]; then
              break
            fi
            sleep 4
          done

          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "Cloudflare tunnel URL not available."
            docker logs "${PROJECT}-tunnel-1" 2>&1 | tail -30 || true
            exit 1
          fi

          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          sed -i "s|^BETTER_AUTH_URL=.*|BETTER_AUTH_URL=${PREVIEW_URL}|" "$PREVIEW_ENV"
          sed -i "s|^APP_URL=.*|APP_URL=${PREVIEW_URL}|" "$PREVIEW_ENV"
          sed -i "s|^DOMAIN=.*|DOMAIN=${PREVIEW_URL#https://}|" "$PREVIEW_ENV"

          docker compose \
            -p "$PROJECT" \
            -f docker-compose.yaml \
            -f docker-compose.pr-preview.yaml \
            -f docker-compose.staging-tunnel.yaml \
            --env-file "$PREVIEW_ENV" \
            up -d --force-recreate --no-deps web

          for i in $(seq 1 45); do
            if curl -fsS --max-time 8 "$PREVIEW_URL/api/health" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for preview health check... ($i)"
            sleep 5
          done

          curl -fsS --max-time 8 "$PREVIEW_URL/api/health" >/dev/null

          ADMIN_PW="$(sed -n 's/^PLATFORM_MASTER_PASSWORD=//p' "$PREVIEW_ENV" | tail -1)"
          LOGIN_CODE=$(curl -sS --max-time 20 \
            -o /tmp/crm-pr-preview-auth.json \
            -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "Origin: ${PREVIEW_URL}" \
            --data "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PW}\"}" \
            "$PREVIEW_URL/api/auth/sign-in/email")
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "preview login FAILED with HTTP $LOGIN_CODE"
            exit 1
          fi
          echo "preview login OK"
      - name: Publish PR preview access
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIEW_URL="${{ steps.preview.outputs.PREVIEW_URL }}"
          if [ -z "$PREVIEW_URL" ]; then
            echo "No preview URL available."
            exit 0
          fi

          PREVIEW_ENV="${{ github.workspace }}/.env.pr-preview"
          ADMIN_EMAIL="$(sed -n 's/^PLATFORM_MASTER_EMAIL=//p' "$PREVIEW_ENV" | tail -1)"
          ADMIN_PW="$(sed -n 's/^PLATFORM_MASTER_PASSWORD=//p' "$PREVIEW_ENV" | tail -1)"
          SAMPLE_PW="$(sed -n 's/^SEED_SAMPLE_PASSWORD=//p' "$PREVIEW_ENV" | tail -1)"

          {
            echo "## PR Preview"
            echo ""
            echo "**Open:** ${PREVIEW_URL}"
            echo ""
            echo "### Login"
            echo ""
            echo "Use **email and password**. Microsoft SSO is unavailable."
            echo ""
            echo "Demo admin: \`${ADMIN_EMAIL}\` / \`${ADMIN_PW}\`"
            echo "Sample users: \`manager@demo.local\`, \`sales1@demo.local\`, \`sales2@demo.local\`, \`viewer@demo.local\` / \`${SAMPLE_PW}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if command -v gh >/dev/null 2>&1; then
            gh pr comment "${{ github.event.number }}" --body "**PR Preview**\nOpen: ${PREVIEW_URL}\n\nDemo admin: \`${ADMIN_EMAIL}\` / \`${ADMIN_PW}\`\nSample users: \`manager@demo.local\`, \`sales1@demo.local\`, \`sales2@demo.local\`, \`viewer@demo.local\` / \`${SAMPLE_PW}\`\n\nMicrosoft SSO is unavailable for this tunnel URL." || true
          fi

      - name: Cleanup on failure
        if: failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_ENV: ${{ github.workspace }}/.env.pr-preview
        run: |
          PROJECT="crm-pr-${PR_NUMBER}"
          set -euo pipefail
          if [ -f "$PREVIEW_ENV" ]; then
            ENV_OPTS=(--env-file "$PREVIEW_ENV")
          else
            ENV_OPTS=()
          fi
          docker compose \
            -p "$PROJECT" \
            -f docker-compose.yaml \
            -f docker-compose.pr-preview.yaml \
            -f docker-compose.staging-tunnel.yaml \
            "${ENV_OPTS[@]}" \
            down -v --remove-orphans || true
          rm -f "${{ github.workspace }}/.env.pr-preview"

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Remove PR preview stack and volumes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_ENV: ${{ github.workspace }}/.env.pr-preview
        run: |
          set -euo pipefail
          PROJECT="crm-pr-${PR_NUMBER}"
          if [ -f "$PREVIEW_ENV" ]; then
            ENV_OPTS=(--env-file "$PREVIEW_ENV")
          else
            ENV_OPTS=()
          fi
          docker compose \
            -p "$PROJECT" \
            -f docker-compose.yaml \
            -f docker-compose.pr-preview.yaml \
            -f docker-compose.staging-tunnel.yaml \
            "${ENV_OPTS[@]}" \
            down -v --remove-orphans || true
          rm -f "${{ github.workspace }}/.env.pr-preview"
