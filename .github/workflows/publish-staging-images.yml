name: publish-staging-images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-staging-images
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.sha }}
  IMAGE_NAMESPACE: ghcr.io/super-erp

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            repository: crm-web
            target: runner
          - name: migrator
            repository: crm-migrator
            target: migrator
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push staging image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.repository }}:sha-${{ env.DEPLOY_SHA }}
          provenance: false
          cache-from: type=gha,scope=staging-${{ matrix.name }},ghtoken=${{ secrets.GITHUB_TOKEN }},repository=${{ github.repository }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.name }},timeout=20m,ignore-error=true
