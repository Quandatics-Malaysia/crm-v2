name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to verify; defaults to the caller commit
        required: false
        type: string
        default: ""
      run_build:
        description: Run the standalone application build
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.6.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/control-protocol run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Migrate PostgreSQL enforcement test database
        run: pnpm --filter web run db:migrate
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/crm
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm
          CRM_APP_PASSWORD: crm_app_test
          BETTER_AUTH_SECRET: ci-test-secret-32-bytes-minimum-value
      - name: Test, requiring PostgreSQL enforcement coverage
        run: pnpm test
        env:
          REQUIRE_DEPLOYMENT_CONTROL_DB_TESTS: "1"
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/crm
          TEST_DATABASE_URL: postgres://crm_app:crm_app_test@localhost:5432/crm
      - run: pnpm run test:workflows
      - run: pnpm run build
        if: ${{ inputs.run_build }}

  publish-staging-images:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            repository: crm-web
            target: runner
          - name: migrator
            repository: crm-migrator
            target: migrator
    env:
      DEPLOY_SHA: ${{ github.sha }}
      IMAGE_NAMESPACE: ghcr.io/super-erp
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push staging image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.repository }}:sha-${{ env.DEPLOY_SHA }}
          provenance: false
          cache-from: type=gha,scope=staging-${{ matrix.name }},ghtoken=${{ secrets.GITHUB_TOKEN }},repository=${{ github.repository }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.name }},timeout=20m,ignore-error=true
