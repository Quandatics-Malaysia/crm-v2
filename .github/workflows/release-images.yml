name: release-images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to build (must be annotated semantic version, e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.event.inputs.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAMESPACE: ghcr.io/quandatics-malaysia
  TARGET_REF: ${{ github.event.inputs.ref }}

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out annotated release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Require strict SemVer annotated tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be strict SemVer: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$TARGET_REF")" != "tag" ]; then
            echo "release tag must be annotated: $TARGET_REF" >&2
            exit 1
          fi

  build:
    needs: validate-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            repository: crm-web
            context: .
            file: Dockerfile
            target: runner
          - name: migrator
            repository: crm-migrator
            context: .
            file: Dockerfile
            target: migrator
          - name: backup
            repository: crm-backup
            context: docker/backup
            file: docker/backup/Dockerfile
            target: ""
          - name: agent
            repository: crm-deployment-agent
            context: .
            file: apps/deployment-agent/Dockerfile
            target: runtime
    steps:
      - name: Check out release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.34.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Build and push untagged immutable digest
        id: build-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.repository }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Validate immutable image reference
        id: image
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.repository }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build did not return an immutable digest: $DIGEST" >&2
            exit 1
          fi
          echo "ref=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Scan digest with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.70.0
          scan-type: image
          scanners: vuln,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p release
      - name: Generate SPDX JSON SBOM from digest
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: release/${{ matrix.name }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
      - name: Sign and verify immutable digest
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"
          cosign verify \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --output=json \
            "$IMAGE_REF" > "release/${{ matrix.name }}.cosign-verification.json"
      - name: Publish version and commit tags after verification
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_NAME: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.repository }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${{ env.TARGET_REF }}" \
            --tag "${IMAGE_NAME}:sha-${{ github.sha }}" \
            "$IMAGE_REF"
      - name: Record immutable image metadata
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_NAME: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.repository }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          jq -n \
            --arg name "${{ matrix.name }}" \
            --arg image "$IMAGE_NAME" \
            --arg image_ref "$IMAGE_REF" \
            --arg digest "$DIGEST" \
            --arg source_commit "$GITHUB_SHA" \
            --arg workflow_identity "$WORKFLOW_IDENTITY" \
            --arg build_time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{name: $name, image: $image, image_ref: $image_ref, digest: $digest, source_commit: $source_commit, workflow_identity: $workflow_identity, build_time: $build_time}' \
            > "release/${{ matrix.name }}-image.json"
      - name: Upload image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.name }}
          path: |
            release/${{ matrix.name }}.spdx.json
            release/${{ matrix.name }}.cosign-verification.json
            release/${{ matrix.name }}-image.json
          if-no-files-found: error
          retention-days: 90

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-inputs
      - name: Compose release manifest
        shell: bash
        env:
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          jq -s \
            --arg release_tag "$TARGET_REF" \
            --arg source_commit "$GITHUB_SHA" \
            --arg workflow_identity "$WORKFLOW_IDENTITY" \
            --arg build_time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{release_tag: $release_tag, source_commit: $source_commit, workflow_identity: $workflow_identity, build_time: $build_time, images: sort_by(.name)}' \
            release-inputs/release-*/*-image.json \
            > release-manifest.json
          jq -e '
            .source_commit == env.GITHUB_SHA and
            .workflow_identity == env.WORKFLOW_IDENTITY and
            (.images | length == 4) and
            ([.images[].name] | sort == ["agent", "backup", "migrator", "web"]) and
            all(.images[]; (.digest | test("^sha256:[0-9a-f]{64}$")))
          ' release-manifest.json >/dev/null
      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ env.TARGET_REF }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
