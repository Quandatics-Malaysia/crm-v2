# Internet-exposed self-host: caddy (HTTPS) → web (Next standalone) → db (Postgres).
# Postgres is published on 127.0.0.1:5433 only (loopback, for SSH-tunnelled admin);
# only Caddy is reachable off-box. Run: docker compose up -d --build
#
# Log rotation is on by default (below). Resource limits default to db 2g /
# web 1g / caddy 128m / backup 256m — tune `mem_limit:` to your host.
# See OPERATIONS.md → Hardening.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    # Localhost-only publish on 5433 so it never clashes with a host Postgres on
    # 5432 and is never internet-exposed. Reach it from a workstation with a SQL
    # client (VeloxDB / DBeaver / TablePlus) via an SSH tunnel — see
    # OPERATIONS.md → "Connect a SQL client (VeloxDB / DBeaver)".
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    logging: *default-logging
    restart: unless-stopped

  # One-shot: applies migrations + RLS + views, sets crm_app password, seeds.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL must be derived before running Compose}
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?MIGRATOR_DATABASE_URL must be derived before running Compose}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?CRM_APP_PASSWORD must be set}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      PLATFORM_MASTER_EMAIL: ${PLATFORM_MASTER_EMAIL:?PLATFORM_MASTER_EMAIL must be set}
      PLATFORM_MASTER_PASSWORD: ${PLATFORM_MASTER_PASSWORD:?PLATFORM_MASTER_PASSWORD must be set to a strong value}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      # Temporary compatibility aliases for older seed code. New deployments
      # configure PLATFORM_MASTER_* only.
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-${PLATFORM_MASTER_EMAIL}}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-${PLATFORM_MASTER_PASSWORD}}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-demo-entity}
      DEMO_TENANT_NAME: ${DEMO_TENANT_NAME:-Demo Workspace}
      DEMO_CURRENCY: ${DEMO_CURRENCY:-USD}
      DEMO_TAX_NAME: ${DEMO_TAX_NAME:-VAT 5%}
      DEMO_TAX_RATE: ${DEMO_TAX_RATE:-5.000}
      # Optional demo/sample data — OFF by default. SEED_SAMPLE_DATA=true layers a
      # rich role-play dataset (accounts, contacts, funnels across every stage,
      # quotations, leads, products…) onto the demo tenant; set it back to false
      # to suspend the demo in a real deployment (records are retained).
      # SEED_SAMPLE_PASSWORD sets the
      # shared sample-login password (falls back to DEMO_ADMIN_PASSWORD; a
      # weak/default is refused in production).
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      SEED_SAMPLE_PASSWORD: ${SEED_SAMPLE_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  web:
    build:
      context: .
      target: runner
    environment:
      NODE_ENV: production
      # App connects as the RLS-enforced crm_app role.
      DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL must be derived before running Compose}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL must be derived before running Compose}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      APP_URL: ${APP_URL:-${BETTER_AUTH_URL:-http://localhost}}
      # Machine-only deployment control. Identity and shared secret have no
      # defaults; release metadata is pinned by the deployed image/release.
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:?DEPLOYMENT_ID must be set}
      AGENT_WEB_SECRET: ${AGENT_WEB_SECRET:?AGENT_WEB_SECRET must be set}
      APPLICATION_VERSION: ${APPLICATION_VERSION:?APPLICATION_VERSION must be set}
      MIGRATION_VERSION: ${MIGRATION_VERSION:?MIGRATION_VERSION must be set}
      VENDOR_ENTITLEMENT_TRUST_SET: ${VENDOR_ENTITLEMENT_TRUST_SET:?VENDOR_ENTITLEMENT_TRUST_SET must be set}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/uploads
    volumes:
      - appfiles:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 1g
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      # The internal HAProxy gateway (10.1.10.1) terminates public TLS and
      # forwards app.quandatics.com to this LAN listener. Restrict access at
      # the host/network firewall; do not expose 8081 directly to the Internet.
      - "${CADDY_BIND_HOST:-0.0.0.0}:${CADDY_HOST_PORT:-8081}:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    logging: *default-logging
    restart: unless-stopped

  # Scheduled backups — daily Full Data export + full pg_dump + appfiles archive,
  # weekly dated snapshot + restore-verification. Writes to the owned `backups`
  # volume. Mirrors the client's Salesforce backup flows (System Admin/Power Automate).
  backup:
    image: postgres:17-alpine
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL must be derived before running Compose}
      # Optional off-box mirror (e.g. user@nas:/backups/crm); unset → skipped.
      BACKUP_RSYNC_TARGET: ${BACKUP_RSYNC_TARGET:-}
    entrypoint: ["/bin/sh", "/ops/scheduler.sh"]
    volumes:
      - ./ops:/ops:ro
      - appfiles:/data/uploads:ro
      - backups:/backups
      # Uncomment when using BACKUP_RSYNC_TARGET: SSH key + known_hosts for the
      # target host (id_ed25519 with 600 perms). See ops/README.md.
      # - ./ops/ssh:/root/.ssh:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    logging: *default-logging
    restart: unless-stopped

volumes:
  pgdata:
  appfiles:
  caddydata:
  caddyconfig:
  backups:
