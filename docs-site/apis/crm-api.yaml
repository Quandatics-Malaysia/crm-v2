openapi: 3.1.0
info:
  title: Quandatics CRM — HTTP API
  version: "1.0"
  description: >
    The CRM's HTTP surface. Most mutations happen through **server actions**
    (see the API Reference page), not REST — these are the route handlers under
    `apps/web/app/api/`. Endpoints below are authenticated + tenant-scoped
    unless noted. The interactive **Test** panel builds and sends real requests;
    live execution against a deployed server requires that server to allow this
    docs origin (CORS) and, for authenticated routes, a valid session cookie.
servers:
  - url: https://app.quandatics.com
    description: Production
  - url: http://localhost:3000
    description: Local dev
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      description: >
        Liveness probe. Runs `select 1` against Postgres. Public (no auth).
        Used by the Docker healthcheck and deploy verification.
      tags: [System]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: degraded }
  /api/tenant-logo:
    get:
      operationId: getTenantLogo
      summary: Active tenant's company logo
      description: >
        Returns the current tenant's uploaded company logo (set in
        Settings → General; rendered on quotation documents). Authenticated +
        tenant-scoped — a member only ever sees their own entity's logo.
      tags: [Files]
      responses:
        "200":
          description: The logo image bytes
          content:
            image/*:
              schema: { type: string, format: binary }
        "403":
          description: No valid session / no active tenant
        "404":
          description: No logo set for this tenant
  /api/files/{id}:
    get:
      operationId: getFile
      summary: Download a stored file
      description: >
        Streams a stored file (e.g. an approval attachment) by id. Authenticated
        and tenant-scoped: the file must belong to the caller's tenant.
      tags: [Files]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The file record id.
      responses:
        "200":
          description: The file bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { description: Not authorized for this file's tenant }
        "404": { description: File not found }
  /api/auth/{path}:
    get:
      operationId: authGet
      summary: Better Auth handler (GET)
      description: >
        Catch-all for Better Auth (`apps/web/app/api/auth/[...all]`). Handles
        sessions, OAuth callbacks (Microsoft Entra: provider id
        `microsoft-entra-id`), etc. Email/password sign-in is a POST to
        `/api/auth/sign-in/email`. See the API Reference page for the auth model.
      tags: [Auth]
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: The Better Auth sub-path (e.g. `get-session`).
      responses:
        "200": { description: Handled by Better Auth }
    post:
      operationId: authPost
      summary: Better Auth handler (POST)
      description: >
        e.g. `POST /api/auth/sign-in/email` with `{ "email", "password" }`.
        Returns 200 + session cookie on success, 401 `INVALID_EMAIL_OR_PASSWORD`
        on bad credentials. Password login is always enabled; a per-tenant
        `allowPasswordLogin` flag can gate it (SSO-only tenants).
      tags: [Auth]
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: The Better Auth sub-path (e.g. `sign-in/email`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, example: admin@demo.local }
                password: { type: string, format: password }
      responses:
        "200": { description: Success (sets a session cookie) }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Invalid email or password }
                  code: { type: string, example: INVALID_EMAIL_OR_PASSWORD }
tags:
  - name: System
    description: Liveness / ops.
  - name: Files
    description: Authenticated, tenant-scoped file downloads.
  - name: Auth
    description: Better Auth (sessions, email/password, Microsoft Entra OAuth).
